# The smallest harness there is. qory harness init wrote it. From this directory:
#
#   qory hc
#   qory hi
#   claude                # then type /hello
#   qory hr
#
apiVersion: qory.ai/v1alpha1
kind: HarnessProfile
name: hello
target:
  runtime: claude       # or compose for two at once: [claude, codex]
layers:
  - name: hello           # read from layers/hello; its harness-layer.yaml says hello
    exclude:
      skills: [greet]     # both layers ship a greet skill; delete this line and compose again
  - name: world
