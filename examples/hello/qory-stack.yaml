# The smallest harness there is. qory harness init wrote it. From this directory:
#
#   qory hc
#   qory hi
#   claude                # then type /hello
#   qory hr
#
apiVersion: qory.ai/v1alpha1
name: hello
target:
  runtime: claude       # or compose for two at once: [claude, codex]
modules:
  - name: hello           # read from modules/hello; its qory-module.yaml says hello
    exclude:
      skills: [greet]     # both modules ship a greet skill; delete this line and compose again
  - name: world
