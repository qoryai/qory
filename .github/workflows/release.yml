name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    # Releases are published from the GitHub mirror, where the archives are downloaded from.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Take the release body from the changelog
        # A tag without a section in CHANGELOG.md does not publish: the section is the
        # release body, above the commit list goreleaser writes.
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" release-notes.md

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-header=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set this secret to publish the Homebrew cask into qoryai/homebrew-tap.
          # Without it the archives are published and the cask is skipped.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  images:
    name: Build and push the agent's images
    # After the release exists, so the list of what was pushed can be attached to it.
    needs: release
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7

      - name: Take the version from the tag
        # The images are tagged as qory version reports it, without the v.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # QEMU builds the architecture the machine does not have.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image is built FROM the digest of the one pushed before it: agent, then
      # agent-docker, then agent-go and agent-go-docker from the one Dockerfile.
      - name: Build and push agent
        id: agent
        uses: docker/build-push-action@v7
        with:
          context: images/agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/agent:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push agent-docker
        id: agent-docker
        uses: docker/build-push-action@v7
        with:
          context: images/agent-docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BASE=${{ env.REGISTRY }}/agent:${{ env.VERSION }}@${{ steps.agent.outputs.digest }}
          tags: ${{ env.REGISTRY }}/agent-docker:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push agent-go
        id: agent-go
        uses: docker/build-push-action@v7
        with:
          context: images/agent-go
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BASE=${{ env.REGISTRY }}/agent:${{ env.VERSION }}@${{ steps.agent.outputs.digest }}
          tags: ${{ env.REGISTRY }}/agent-go:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push agent-go-docker
        id: agent-go-docker
        uses: docker/build-push-action@v7
        with:
          context: images/agent-go
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=${{ env.REGISTRY }}/agent-docker:${{ env.VERSION }}@${{ steps.agent-docker.outputs.digest }}
            TITLE=agent-go-docker
          tags: ${{ env.REGISTRY }}/agent-go-docker:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attach the pushed references to the release
        # images.txt holds one reference per line, by tag and digest, as runner.yaml names
        # an image; the job summary shows the same lines.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT: ${{ steps.agent.outputs.digest }}
          AGENT_DOCKER: ${{ steps.agent-docker.outputs.digest }}
          AGENT_GO: ${{ steps.agent-go.outputs.digest }}
          AGENT_GO_DOCKER: ${{ steps.agent-go-docker.outputs.digest }}
        run: |
          {
            echo "$REGISTRY/agent:$VERSION@$AGENT"
            echo "$REGISTRY/agent-docker:$VERSION@$AGENT_DOCKER"
            echo "$REGISTRY/agent-go:$VERSION@$AGENT_GO"
            echo "$REGISTRY/agent-go-docker:$VERSION@$AGENT_GO_DOCKER"
          } > images.txt
          {
            echo "## The agent's images"
            echo
            echo '```'
            cat images.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$GITHUB_REF_NAME" images.txt --clobber --repo "$GITHUB_REPOSITORY"
