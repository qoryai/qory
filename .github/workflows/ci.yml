name: CI

on:
  push:
    branches: [main, next]
  pull_request:

# A newer push to a pull request cancels the pull request's run in progress or
# waiting. Every push to main or next runs on its own, and is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # A pull request from this repository's next is skipped: each push to next runs
    # these steps already. One from a fork's branch named next runs. The skipped job
    # has a name of its own, so the required "Go tests" can only come from next's
    # push run: a skipped job reports success.
    name: ${{ github.event_name == 'pull_request' && github.head_ref == 'next' && github.event.pull_request.head.repo.full_name == github.repository && 'Go tests · checked by the push run' || 'Go tests' }}
    if: github.event_name != 'pull_request' || github.head_ref != 'next' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    container:
      image: docker.io/golang:1.27
    steps:
      - name: Install node for the JavaScript actions
        # checkout@v7 runs on node 24; the image has none.
        env:
          NODE_VERSION: 24.20.0
        run: |
          case "$(uname -m)" in aarch64) arch=arm64 ;; x86_64) arch=x64 ;; *) echo "unsupported arch" >&2; exit 1 ;; esac
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${arch}.tar.gz" \
            | tar -xz -C /usr/local --strip-components=1
          node --version

      - uses: actions/checkout@v7

      - name: Trust the checkout
        # The checkout belongs to the runner user, the container runs as root, and git
        # refuses to read a repository it sees as someone else's. `go build` stamps the
        # commit into the binary and fails without it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the module cache
        uses: actions/cache@v6
        with:
          path: /go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Find the build cache
        # Asked of go, as the runner sets HOME for the container, and the cache is under it.
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          # Each run saves its own, and restores the newest of the same go.sum first.
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            gocache-${{ runner.os }}-

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        # Every test runs on every push: many run git, and go's test cache does not see it.
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...

      - name: Check doc comments
        run: go run github.com/mgechev/revive@v1.16.0 -config revive.toml -set_exit_status ./...

      - name: Check the command reference is current
        run: |
          go run ./internal/gendocs "$RUNNER_TEMP/commands"
          diff -r docs/commands "$RUNNER_TEMP/commands"
