name: CI

on:
  push:
    branches: [main, next, factory]
  pull_request:

# A newer push to a pull request cancels the pull request's run in progress or
# waiting. Every push to main, next or factory runs on its own, and is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # A pull request from this repository's next is skipped: each push to next runs
    # these steps already. One from a fork's branch named next runs. The skipped job
    # has a name of its own, so the required "Go tests" can only come from next's
    # push run: a skipped job reports success.
    name: ${{ github.event_name == 'pull_request' && github.head_ref == 'next' && github.event.pull_request.head.repo.full_name == github.repository && 'Go tests · checked by the push run' || 'Go tests' }}
    if: github.event_name != 'pull_request' || github.head_ref != 'next' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    container:
      # Docker Hub's official golang:1.27, copied by digest to qoryai's public package,
      # and pulled with the job's token. The container has no docker command and no
      # engine, so the tests that start containers skip here.
      image: ghcr.io/qoryai/ci-images:golang-1.27@sha256:e432b43af23a9328d56a7c499be0476810aa344acbcf65fc7c455d4ff5a40602
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install node for the JavaScript actions
        # checkout@v7 runs on node 24; the image has none.
        env:
          NODE_VERSION: 24.20.0
        run: |
          case "$(uname -m)" in aarch64) arch=arm64 ;; x86_64) arch=x64 ;; *) echo "unsupported arch" >&2; exit 1 ;; esac
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${arch}.tar.gz" \
            | tar -xz -C /usr/local --strip-components=1
          node --version

      - uses: actions/checkout@v7

      - name: Trust the checkout
        # The checkout belongs to the runner user, the container runs as root, and git
        # refuses to read a repository it sees as someone else's. `go build` stamps the
        # commit into the binary and fails without it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the module cache
        uses: actions/cache@v6
        with:
          path: /go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Find the build cache
        # Asked of go, as the runner sets HOME for the container, and the cache is under it.
        # The mark, an hour before the job, tells the entries this run uses from the rest:
        # go sets an entry's time to now when it uses one older than an hour.
        id: gocache
        run: |
          echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          touch -d '1 hour ago' "$RUNNER_TEMP/gocache-mark"

      # A push, to next or main, saves the build cache under its own commit, and a run
      # restores the newest saved under the same go.sum, else the newest of all, so go
      # compiles only what changed since. A pull request's run restores but saves nothing.
      - name: Restore the build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            gocache-${{ runner.os }}-

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        # Every test runs on every push: many run git, and go's test cache does not see it.
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...

      - name: Check doc comments
        run: go run github.com/mgechev/revive@v1.16.0 -config revive.toml -set_exit_status ./...

      - name: Check the command reference is current
        run: |
          go run ./internal/gendocs "$RUNNER_TEMP/commands"
          diff -r docs/commands "$RUNNER_TEMP/commands"

      # After the last step that compiles, and also when a check failed: every entry go
      # wrote is sound. Only the entries this run used are kept, so the cache holds one
      # build of the code and its tools, and does not grow from push to push.
      - name: Keep only the build cache this run used
        if: ${{ !cancelled() && github.event_name == 'push' && steps.restore-gocache.outcome == 'success' && steps.restore-gocache.outputs.cache-hit != 'true' }}
        run: find "${{ steps.gocache.outputs.dir }}" -mindepth 2 -type f ! -newer "$RUNNER_TEMP/gocache-mark" -delete

      - name: Save the build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.restore-gocache.outcome == 'success' && steps.restore-gocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}
