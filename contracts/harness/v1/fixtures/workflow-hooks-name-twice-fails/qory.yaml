apiVersion: qory.dev/v1alpha1
harness:
  extends: {path: stack}
  target:
    runtime: claude
  modules:
    - name: licence
      source: {path: modules/licence}
  hooks:
    - {at: after-review-round, kind: check, run: scripts/check-licences.sh}
    - {at: after-review-round, kind: check, run: scripts/check-licences.sh --strict}
