apiVersion: qory.dev/v1alpha1
harness:
  extends: {path: stack}
  target:
    runtime: claude
  modules:
    - name: licence
      source: {path: modules/licence}
  hooks:
    - {at: after-review-round, kind: check, run: scripts/check-licences.sh}
    - {at: after-review-round, kind: review, agent: licence-reviewer, required: false, timeout: 10m}
    - {at: after-plan, kind: enrich, name: notes, run: scripts/write-notes.sh --all, timeout: 2m}
    - {at: before-matrix, kind: check, run: scripts/check-licences.sh --matrix}
    - {at: after-code-map, kind: enrich, name: code-map-notes, agent: licence-reviewer, timeout: 90s}
