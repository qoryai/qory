apiVersion: qory.dev/v1alpha1
name: software
modules:
  - name: core
    source: {path: modules/core}
workflows:
  plan-the-build:
    access: write
    hook_points:
      after-plan: {at: end, kinds: [check, enrich]}
      after-code-map: {at: inside, kinds: [enrich]}
  review-changes:
    hook_points:
      after-review-round: {at: end, kinds: [check, review]}
  verify:
    hook_points:
      before-matrix: {at: start, kinds: [check]}
extending:
  kinds: [agents]
  hooks: {per_workflow: 2}
